server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        # $host recorta el puerto cuando se entra por IP:puerto directo, lo que
        # rompe el CSRF de Django (el Origin del navegador sí trae el puerto).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reenvía el proto que puso el nginx del host (termina TLS ahí, no aquí)
        # en vez de $scheme, que aquí siempre sería "http".
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
