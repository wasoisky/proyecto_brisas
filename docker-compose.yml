services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - default
      - proxy_network
      - postgres_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # El admin creó un proxy global en el host que enruta cada dominio hacia
    # el puerto asignado a cada proyecto; a este le tocó el 81. Se mantiene
    # publicado en todas las interfaces (no solo localhost) como respaldo por
    # si el proxy global todavía no enruta el dominio, para no perder acceso.
    # También se conecta a proxy_network para que el proxy del host pueda
    # llegar por red interna de Docker (necesario para que sirva /static/ y
    # /media/ igual que hoy; si el proxy apunta directo al contenedor "web"
    # esos dos endpoints dejan de funcionar).
    ports:
      - "81:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - default
      - proxy_network

networks:
  default:
  proxy_network:
    external: true
  postgres_network:
    external: true

volumes:
  postgres_data:
  static_volume:
  media_volume:
