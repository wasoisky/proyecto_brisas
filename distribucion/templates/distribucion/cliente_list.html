{% extends "base.html" %}
{% block title %}Clientes — Brisas de Pacandé{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <h4 class="mb-0"><i class="bi bi-people me-2"></i>Clientes</h4>
  <a href="{% url 'distribucion:cliente_create' %}" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg me-1"></i>Nuevo cliente
  </a>
</div>

<div class="card mb-3">
  <div class="card-body py-2">
    <form method="get" id="form-filtro-clientes" class="row g-2 align-items-end">
      <div class="col-auto">
        <input type="text" name="q" class="form-control form-control-sm" placeholder="Buscar nombre..."
               value="{{ request.GET.q }}">
      </div>
      <div class="col-auto">
        <select name="activo" class="form-select form-select-sm">
          <option value="">Todos</option>
          <option value="1" {% if request.GET.activo == '1' %}selected{% endif %}>Activos</option>
          <option value="0" {% if request.GET.activo == '0' %}selected{% endif %}>Inactivos</option>
        </select>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-secondary btn-sm">Buscar</button>
        <a href="{% url 'distribucion:cliente_list' %}" class="btn btn-outline-secondary btn-sm ms-1">Limpiar</a>
      </div>
    </form>
  </div>
</div>

<div id="resultados-clientes">
  {% include "distribucion/_cliente_tabla.html" %}
</div>
{% endblock %}

{% block extra_js %}
{% load static %}
<script src="{% static 'js/filtro-vivo.js' %}"></script>
<script>
  initFiltroVivo('form-filtro-clientes', 'resultados-clientes');
</script>
{% endblock %}
