{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso bloqueado — Brisas de Pacandé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(150deg, #1B2870 0%, #1E5FA8 55%, #1A8DC8 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div class="text-center text-white px-3" style="max-width:420px">
    <img src="{% static 'img/logo.jpg' %}" alt="Logo"
         style="width:90px;height:90px;object-fit:contain;border-radius:50%;
                border:3px solid rgba(255,255,255,.3);margin-bottom:1.5rem">

    <div class="mb-3">
      <i class="bi bi-shield-lock-fill text-warning" style="font-size:3rem"></i>
    </div>

    <h4 class="fw-bold mb-2">Acceso temporalmente bloqueado</h4>
    <p style="opacity:.8" class="mb-4">
      Se detectaron demasiados intentos de inicio de sesión fallidos.<br>
      Tu acceso está bloqueado por <strong>1 hora</strong>.<br>
      Si crees que es un error, contacta al administrador del sistema.
    </p>

    <a href="{% url 'login' %}" class="btn btn-light btn-lg rounded-3 px-4 fw-semibold">
      <i class="bi bi-arrow-left me-2"></i>Volver al inicio de sesión
    </a>
  </div>
</body>
</html>
