{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sesión cerrada — Brisas de Pacandé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(150deg, #1B2870 0%, #1E5FA8 55%, #1A8DC8 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div class="text-center text-white px-3" style="max-width:380px">
    <img src="{% static 'img/logo.jpg' %}" alt="Logo Brisas de Pacandé"
         style="width:110px;height:110px;object-fit:contain;border-radius:50%;
                border:3px solid rgba(255,255,255,.35);
                box-shadow:0 6px 24px rgba(0,0,0,.25);
                margin-bottom:1.25rem">
    <h4 class="fw-bold mb-1">Sesión cerrada</h4>
    <p class="mb-4" style="opacity:.75">Has salido del sistema correctamente.</p>
    <a href="{% url 'login' %}" class="btn btn-light btn-lg rounded-3 px-4 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Volver a ingresar
    </a>
  </div>
</body>
</html>
